<script>
  // aplica o tema salvo antes de pintar, sem piscar; o padrão é o claro
  var t = 'light';
  try { t = localStorage.getItem('lastro-tema-v2') || 'light'; } catch (e) {}
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
</script>
<script type="module" src="app.js"></script>
</head>
<body class="sem-faixa">
<div id="faixa"></div>
<div class="app">
<main id="tela" tabindex="-1"><div class="carregando" aria-label="Carregando"><div></div><div></div><div></div></div></main>
</div>
<nav id="nav" class="nav" aria-label="Navegação principal"></nav>
<div id="toast" role="status" aria-live="polite"></div>
